version: '3.8'

services:

  bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sales-bot

    # Expose port 8000 for Cloudflare Tunnel
    ports:
      - "8000:8000"

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/salesbot
      # Connection pool settings
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      DATABASE_CONNECTION_TIMEOUT: 30000
      REDIS_URL: redis://redis:6379
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_SECRET_TOKEN: ${WEBHOOK_SECRET_TOKEN}
      PORT: 8000
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_CHAT_ID: ${UPLOAD_CHAT_ID}

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: /app/uploads

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      # Database connection resilience
      # DATABASE_CONNECTION_TIMEOUT: 30
      DATABASE_MAX_RETRIES: 5
      DATABASE_RETRY_DELAY: 1000

    volumes:
      - bot-uploads:/app/uploads
      - bot-logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - internal-network

    # Container hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  postgres:
    image: postgres:15-alpine

    container_name: salesbot-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: salesbot

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - internal-network

    expose:
      - "5432"

    # Container hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: salesbot-redis

    command: redis-server --appendonly yes --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    restart: unless-stopped

    networks:
      - internal-network

    expose:
      - "6379"

    # Container hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:
  redis-data:
  bot-uploads:
  bot-logs:


networks:
  internal-network:
    driver: bridge
    internal: true
